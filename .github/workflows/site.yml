name: Site

# Publishes site/ as the project's landing page on GitHub Pages.
#
# The page is deliberately dependency-free: two files and some inline SVG. The
# only build step is staging, and it exists for one reason — index.html refers
# to the screenshots as ../docs/*.png, because in the repository it lives in
# site/ next to docs/. At the published root that would resolve above the site
# root, so the images are copied to docs/ under the published root and the
# references are rewritten to match.

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one rather than
# queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Stage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Stage the page with the images it references
        run: |
          set -euo pipefail
          mkdir -p _site/docs
          cp -R site/. _site/
          # Every screenshot the page uses, generated by scripts/shots.py and
          # by hand from a real device for the APK. Recursive: the images are
          # per-language, so docs/zh/ is not optional — a plain docs/*.png
          # copies the English set and silently drops the rest.
          cp -R docs/. _site/docs/
          touch _site/.nojekyll

          # site/ is written for its in-repo location, where docs/ is a sibling
          # of site/. Under the published root it is not. i18n.js needs this as
          # much as index.html does: the screenshot paths live in the
          # dictionary, so rewriting only the HTML leaves the language switch
          # pointing one directory above the site root.
          sed -i 's|\.\./docs/|docs/|g' _site/index.html _site/i18n.js
          if grep -l '\.\./docs/' _site/index.html _site/i18n.js; then
            echo "still contains ../docs/ references after rewriting" >&2
            exit 1
          fi

      - name: Check every referenced asset is present
        run: |
          set -euo pipefail
          # Pull every asset path the page can ask for and make sure it resolves
          # to a file that got staged. Two sources, because the screenshots come
          # from both: static src/href in the markup, and the per-language paths
          # in the dictionary that the language switch swaps in. Reading only
          # the HTML is how docs/zh/ went missing while the check stayed green.
          {
            grep -oE '(src|href)="[^"]+"' _site/index.html \
              | sed -E 's/^(src|href)="//; s/"$//'
            grep -oE "'shot\.[a-zA-Z0-9.]+\.src':[[:space:]]*'[^']+'" _site/i18n.js \
              | sed -E "s/^.*:[[:space:]]*'//; s/'$//"
          } | grep -vE '^(https?:|#|mailto:)' | sort -u > /tmp/refs.txt

          fail=0
          # Read from a file rather than a pipe: a `while` on the right of a
          # pipe runs in a subshell, so `fail=1` would be thrown away.
          while read -r ref; do
            path="_site/${ref%%#*}"
            if [ ! -e "$path" ]; then
              echo "missing staged asset: $ref -> $path" >&2
              fail=1
            fi
          done < /tmp/refs.txt
          test "$fail" -eq 0

          echo "checked $(wc -l < /tmp/refs.txt) references"
          echo "staged:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
