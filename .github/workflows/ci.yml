name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Not gofmt-clean:"
            echo "$out"
            exit 1
          fi

  macos:
    name: macOS (vet + test + build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build
        run: make build

  linux:
    name: Linux (vet + test + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build
        run: make build

  windows:
    name: Windows (test + build)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          $env:CGO_ENABLED = "0"
          go build -tags production -trimpath -o cabledrop.exe .
