<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CableDrop</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panel.css">
</head>
<body class="panel is-loading">

<!-- icon sprite: inline so there is nothing to load and nothing to bundle -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cable" viewBox="0 0 24 24"><path d="M8 7.5v5a4 4 0 0 0 8 0v-5" fill="none"/><path d="M5.6 3.6h4.8L8 7.2Z M13.6 7.2h4.8L16 3.6Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10.6 18.6h2.8"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4.5" y="5" width="15" height="10" rx="1.6"/><path d="M2.5 18h19"/></symbol>
  <symbol id="i-usb" viewBox="0 0 24 24"><path d="M12 20V6.5"/><path d="M12 6.5 9.2 9.7M12 6.5l2.8 3.2"/><circle cx="7" cy="15.5" r="1.6"/><circle cx="17" cy="12.5" r="1.6"/><path d="M7 13.9V11m10 0V9"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.5c0 4.6-3 7.6-7 9-4-1.4-7-4.4-7-9V6z"/><path d="M12 3.5V20" stroke-width="0" fill="none"/><path d="m9.2 11.8 2 2 3.6-4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6a2 2 0 0 1 1.6.8l.9 1.2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15"/><path d="M18 13l-6 6-6-6"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 3 2.6 15 0 18-2.6-3-2.6-15 0-18z"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5h-5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M14.5 6 9 12l5.5 6"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 6l5.5 6-5.5 6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.8 21 19.2H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.5 12 20 4.5 15.5 20l-3.6-6.3z"/><path d="M11.9 13.7 20 4.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V6.2A1.7 1.7 0 0 1 6.7 4.5H15"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><rect x="8" y="3.5" width="8" height="4" rx="1.4"/><path d="M16 5.5h1.6A1.9 1.9 0 0 1 19.5 7.4v11.2a1.9 1.9 0 0 1-1.9 1.9H6.4a1.9 1.9 0 0 1-1.9-1.9V7.4A1.9 1.9 0 0 1 6.4 5.5H8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 10 18l9.5-11"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/><path d="M6.5 7l.8 12a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/></symbol>
</svg>

<div class="wrap">

  <header class="topbar">
    <span class="chip dev-glyph" id="devGlyph" aria-hidden="true"><svg class="ic"><use href="#i-phone"/></svg></span>
    <div class="status">
      <span class="status-name" id="devName" data-i18n="panel.detecting"></span>
      <span class="status-sub" id="devSub"></span>
    </div>
    <div class="link-diagram" id="linkDiagram" aria-hidden="true">
      <span class="ld-item"><svg class="ic"><use href="#i-laptop"/></svg><span>Mac</span></span>
      <span class="ld-line"></span>
      <span class="ld-item"><svg class="ic"><use href="#i-usb"/></svg><span>USB</span></span>
      <span class="ld-line"></span>
      <span class="ld-item"><svg class="ic"><use href="#i-phone"/></svg><span>Android</span></span>
    </div>
    <button class="icon-btn" id="refresh" data-i18n-title="panel.refresh" data-i18n-aria="panel.refresh">
      <svg class="ic"><use href="#i-refresh"/></svg>
    </button>
    <button class="icon-btn" id="panelClose" data-i18n-title="panel.closeTitle" data-i18n-aria="panel.close">
      <svg class="ic"><use href="#i-x"/></svg>
    </button>
  </header>

  <div class="scroll" id="scroll">

    <div class="skel-page" id="skeleton" aria-hidden="true">
      <div class="tiles">
        <div class="skel skel-tile"></div><div class="skel skel-tile"></div>
        <div class="skel skel-tile"></div><div class="skel skel-tile"></div>
      </div>
      <div class="skel skel-row wide"></div>
      <div class="skel skel-group-label"></div>
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
    </div>

    <div id="errorBox" hidden></div>

    <!-- ============ home ============ -->
    <section id="v-home" class="view">
      <div class="tiles">
        <button class="tile drop" id="tSend">
          <span class="drop-zone">
            <span class="chip tile-glyph"><svg class="ic"><use href="#i-up"/></svg></span>
            <span class="tile-text">
              <span class="tile-title" data-i18n="panel.send.title"></span>
              <span class="tile-sub" data-i18n="panel.send.sub"></span>
            </span>
          </span>
          <span class="tile-micro" data-i18n="panel.send.micro"></span>
          <span class="drop-tag" hidden data-i18n="panel.drop.tag"></span>
        </button>

        <button class="tile" id="tFiles">
          <span class="chip tile-glyph glyph-ok"><svg class="ic"><use href="#i-folder"/></svg></span>
          <span class="tile-text">
            <span class="tile-title"><span data-i18n="panel.files.title"></span><span class="chev"><svg class="ic sm-ic"><use href="#i-chev-r"/></svg></span></span>
            <span class="tile-sub" data-i18n="panel.files.sub"></span>
            <span class="tile-micro" data-i18n="panel.files.micro"></span>
          </span>
        </button>

        <div class="tile" id="tText" role="button" tabindex="0">
          <span class="chip tile-glyph glyph-purple"><svg class="ic"><use href="#i-clip"/></svg></span>
          <span class="tile-text">
            <span class="tile-title"><span data-i18n="panel.text.title"></span><span class="chev"><svg class="ic sm-ic"><use href="#i-chev-r"/></svg></span></span>
            <span class="tile-sub" data-i18n="panel.text.sub"></span>
            <span class="tile-micro"><span class="pill-purple" data-i18n="panel.text.micro"></span></span>
          </span>
        </div>

        <div class="tile stacked" id="tServe" role="button" tabindex="0">
          <span class="stack-top">
            <span class="chip tile-glyph"><svg class="ic"><use href="#i-globe"/></svg></span>
            <span class="tile-text">
              <span class="tile-title"><span data-i18n="panel.serve.title"></span><span class="chev"><svg class="ic sm-ic"><use href="#i-chev-r"/></svg></span></span>
              <span class="tile-sub" id="serveSub" data-i18n="panel.serve.sub"></span>
            </span>
          </span>
          <span class="url-row">
            <span class="url-box selectable" id="serveURL">localhost:8765</span>
            <button class="btn-copy" id="copyURL" data-i18n="common.copy" data-i18n-title="panel.serve.copyTitle"></button>
          </span>
        </div>
      </div>

      <div class="card row dest-row">
        <span class="chip tile-glyph glyph-blue"><svg class="ic"><use href="#i-folder"/></svg></span>
        <span class="row-main">
          <span class="row-title" data-i18n="panel.dest.title"></span>
          <span class="dest-path selectable" id="dirPath">—</span>
          <span class="dest-note" data-i18n="panel.dest.note"></span>
        </span>
        <span class="row-actions">
          <button class="btn-outline" id="openDir" data-i18n="panel.dest.open"></button>
          <button class="btn-outline" id="changeDir" data-i18n="panel.dest.change"></button>
        </span>
      </div>

      <section class="group">
        <div class="group-head">
          <h2 data-i18n="panel.tx.title"></h2>
          <span class="head-links">
            <button class="link" id="toggleTx" hidden></button>
            <button class="link" id="clearTx" hidden data-i18n="panel.tx.clear"></button>
          </span>
        </div>
        <div class="card" id="txCard">
          <div class="empty">
            <svg class="ic"><use href="#i-send"/></svg>
            <span class="empty-title" data-i18n="panel.tx.emptyTitle"></span>
            <span class="empty-hint" data-i18n="panel.tx.emptyHint"></span>
          </div>
        </div>
      </section>
    </section>

    <!-- ============ device files ============ -->
    <section id="v-files" class="view" hidden>
      <div class="card row bar-row">
        <button class="back" id="filesBack">
          <svg class="ic sm-ic"><use href="#i-chev"/></svg><span data-i18n="common.back"></span>
        </button>
        <span class="crumb selectable" id="filesPath">/sdcard</span>
        <button class="icon-btn" id="filesUp" data-i18n-title="panel.files.up" data-i18n-aria="panel.files.up">
          <svg class="ic"><use href="#i-up"/></svg>
        </button>
      </div>
      <div class="card" id="filesList">
        <div class="empty"><span class="empty-title" data-i18n="common.loading"></span></div>
      </div>
      <p class="hint" data-i18n="panel.files.hint"></p>
    </section>

    <!-- ============ text ============ -->
    <section id="v-text" class="view" hidden>
      <div class="card row bar-row">
        <button class="back" id="textBack">
          <svg class="ic sm-ic"><use href="#i-chev"/></svg><span data-i18n="common.back"></span>
        </button>
        <span class="crumb" data-i18n="panel.text.crumb"></span>
      </div>

      <section class="group">
        <div class="group-head"><h2 data-i18n="panel.text.sendTitle"></h2></div>
        <textarea id="textOut" placeholder="" data-i18n-ph="panel.text.placeholder" spellcheck="false"></textarea>
        <div class="btn-row">
          <button class="btn ghost" id="useClip">
            <svg class="ic sm-ic"><use href="#i-clip"/></svg><span data-i18n="panel.text.useClip"></span>
          </button>
          <button class="btn" id="sendText">
            <svg class="ic sm-ic"><use href="#i-send"/></svg><span data-i18n="panel.text.send"></span>
          </button>
        </div>
        <p class="hint" id="textHint" role="status" data-i18n="panel.text.hint"></p>
      </section>

      <section class="group">
        <div class="group-head">
          <h2 data-i18n="panel.text.clipTitle"></h2>
          <button class="link" id="copyClip" data-i18n="common.copy"></button>
        </div>
        <div class="note-box selectable" id="clipView" data-i18n="common.empty"></div>
        <p class="hint" data-i18n="panel.text.clipHint"></p>
      </section>
    </section>

  </div>

  <footer class="trust">
    <span class="trust-left">
      <svg class="ic"><use href="#i-shield"/></svg>
      <span data-i18n="panel.trust"></span>
    </span>
    <span class="trust-right">
      <span data-i18n="panel.trustRight"></span>
      <button class="lang-btn" data-i18n-toggle data-i18n-title="common.langTitle" data-i18n-aria="common.langTitle"></button>
    </span>
  </footer>
</div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
