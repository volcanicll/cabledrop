<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CableDrop</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/phone.css">
</head>
<body class="phone">

<!-- icon sprite first, so every <use> below resolves -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cable" viewBox="0 0 24 24"><path d="M8 7.5v5a4 4 0 0 0 8 0v-5" fill="none"/><path d="M5.6 3.6h4.8L8 7.2Z M13.6 7.2h4.8L16 3.6Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V6.2A1.7 1.7 0 0 1 6.7 4.5H15"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.5 12 20 4.5 15.5 20l-3.6-6.3z"/><path d="M11.9 13.7 20 4.5"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6a2 2 0 0 1 1.6.8l.9 1.2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15"/><path d="M18 13l-6 6-6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M14.5 6 9 12l5.5 6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5h-5"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><rect x="8" y="3.5" width="8" height="4" rx="1.4"/><path d="M16 5.5h1.6A1.9 1.9 0 0 1 19.5 7.4v11.2a1.9 1.9 0 0 1-1.9 1.9H6.4a1.9 1.9 0 0 1-1.9-1.9V7.4A1.9 1.9 0 0 1 6.4 5.5H8"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.5c0 4.6-3 7.6-7 9-4-1.4-7-4.4-7-9V6z"/><path d="m9.2 11.8 2 2 3.6-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 10 18l9.5-11"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.8 21 19.2H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4.5" y="5" width="15" height="10" rx="1.6"/><path d="M2.5 18h19"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10.6 18.6h2.8"/></symbol>
</svg>

<header class="p-head">
  <span class="chip p-logo" aria-hidden="true"><svg class="ic"><use href="#i-cable"/></svg></span>
  <div class="p-head-text">
    <span class="p-title">CableDrop</span>
    <span class="p-sub"><span class="p-dot" id="connDot"></span><span id="sub">连接中…</span></span>
  </div>
  <span class="p-link" aria-hidden="true">
    <svg class="ic sm-ic"><use href="#i-laptop"/></svg>
    <span class="p-link-line"></span>
    <svg class="ic sm-ic"><use href="#i-phone"/></svg>
  </span>
</header>

<div class="p-trust">
  <svg class="ic sm-ic"><use href="#i-shield"/></svg>
  <span>USB 直连 · 数据不经过网络</span>
</div>

<main class="p-scroll" id="scroller">
  <div class="p-col">

    <section class="p-card p-offline" id="offline" hidden>
      <svg class="ic"><use href="#i-alert"/></svg>
      <span class="p-offline-text">
        <b>未连接到电脑</b>
        <span>请确认数据线已插好、电脑端 CableDrop 正在运行，然后下拉或点刷新。</span>
      </span>
      <button class="btn sm" id="retryConn">重试</button>
    </section>

    <section class="p-card p-note-card" id="noteCard" hidden>
      <div class="p-label">电脑发来的内容</div>
      <div class="p-note selectable" id="noteText"></div>
      <button class="btn" id="copyNote">
        <svg class="ic sm-ic"><use href="#i-copy"/></svg>复制到手机
      </button>
    </section>

    <section class="p-card">
      <div class="p-label"><svg class="ic sm-ic"><use href="#i-clip"/></svg>电脑剪贴板</div>
      <div class="p-note selectable" id="clipText">（空）</div>
      <button class="btn" id="copyClip">
        <svg class="ic sm-ic"><use href="#i-copy"/></svg>复制到手机
      </button>
    </section>

    <section class="p-card">
      <div class="p-label"><svg class="ic sm-ic"><use href="#i-send"/></svg>发到电脑</div>
      <textarea id="toMac" placeholder="粘贴或输入文本，发送后直接进电脑剪贴板" spellcheck="false"></textarea>
      <button class="btn" id="sendMac">
        <svg class="ic sm-ic"><use href="#i-send"/></svg>发送到电脑
      </button>
    </section>

    <section class="p-card">
      <div class="p-label"><svg class="ic sm-ic"><use href="#i-up"/></svg>传文件到电脑</div>
      <label class="p-filepick">
        <input type="file" id="fileInput" multiple>
        <span id="filePickText">选择要上传的文件</span>
      </label>
      <button class="btn" id="upload" disabled>上传</button>
      <div class="p-progress" id="upProgress" hidden><div id="upBar"></div></div>
    </section>

    <section class="p-card">
      <div class="p-label"><svg class="ic sm-ic"><use href="#i-folder"/></svg>电脑上的文件</div>
      <div class="p-path" id="filePath" hidden>
        <button class="icon-btn" id="filesUp" title="上一级" aria-label="上一级">
          <svg class="ic sm-ic"><use href="#i-chev"/></svg>
        </button>
        <span class="p-path-crumb selectable" id="filePathCrumb"></span>
      </div>
      <div id="files" class="p-list"><div class="empty">读取中…</div></div>
      <button class="btn ghost" id="reload">
        <svg class="ic sm-ic"><use href="#i-refresh"/></svg>刷新列表
      </button>
    </section>

    <div class="p-foot">CableDrop · 一根线传文件与文字</div>
  </div>
</main>

<div class="p-toast" id="toast" role="status" hidden></div>

<script src="js/api.js"></script>
<script src="js/phone.js"></script>
</body>
</html>
